services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: qr-code-app
    ports:
      - "${PORT:-8088}:8088"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-qr_code}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3OA==}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-https://your-s3-or-rustfs-endpoint.com}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-your_s3_access_key}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY:-your_s3_secret_key}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-qrcode-media}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: qr-code-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qr_code}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - qr-code-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-qr_code}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qr-code-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - qr-code-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qr-code-postgres-data:
  qr-code-redis-data:
