# Base & Common Exceptions
org.oplearn.project.exception.base.BadRequestException=Yêu cầu không hợp lệ
org.oplearn.project.exception.base.ConflictException=%objectName% với id %id% đã tồn tại
org.oplearn.project.exception.base.NotFoundException=Không tìm thấy %objectName% với id %id%
org.oplearn.project.exception.base.InternalServerError=Hệ thống đang gặp sự cố, vui lòng thử lại sau ít phút
org.oplearn.project.exception.base.UnauthorizedException=Bạn cần đăng nhập để thực hiện thao tác này
org.oplearn.project.exception.UserUnauthorizedException=Bạn không có quyền thực hiện thao tác này
org.oplearn.project.exception.UserForbiddenException=Bạn không có quyền thực hiện thao tác này

# User & Auth Exceptions
org.oplearn.project.exception.UserNotFoundException=Không tìm thấy người dùng
org.oplearn.project.exception.UsernameAlreadyExistedException=Tên đăng nhập này đã có người sử dụng, vui lòng chọn tên khác
org.oplearn.project.exception.PhoneNumberAlreadyExistedException=Số điện thoại này đã được sử dụng bởi một tài khoản khác, vui lòng chọn số khác
org.oplearn.project.exception.EmailAlreadyExistedException=Email này đã được đăng ký, vui lòng dùng email khác
org.oplearn.project.exception.InvalidCredentialException=Tên đăng nhập hoặc mật khẩu không chính xác
org.oplearn.project.exception.InvalidRefreshTokenException=Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại
org.oplearn.project.exception.InvalidOtpException=Mã OTP không chính xác
org.oplearn.project.exception.OtpExpiredException=Mã OTP đã hết hạn hoặc không tồn tại
org.oplearn.project.exception.ProtectedAccountException=Đây là tài khoản hệ thống được bảo vệ, chỉ chính chủ mới được sửa

# Category Exceptions
org.oplearn.project.exception.CategoryNotFoundException=Không tìm thấy danh mục món ăn
org.oplearn.project.exception.CategoryAlreadyExistedException=Tên danh mục này đã tồn tại

# Product Exceptions
org.oplearn.project.exception.ProductNotFoundException=Không tìm thấy món ăn / đồ uống
org.oplearn.project.exception.ProductAlreadyExistedException=Tên món này đã tồn tại trong thực đơn
org.oplearn.project.exception.ProductUnavailableException=Món '%name%' hiện đã tạm hết hoặc ngưng phục vụ, vui lòng chọn món khác

# Store Table Exceptions
org.oplearn.project.exception.StoreTableNotFoundException=Không tìm thấy thông tin bàn phục vụ
org.oplearn.project.exception.StoreTableAlreadyExistedException=Số bàn / tên bàn này đã tồn tại
org.oplearn.project.exception.TableRequiredException=Vui lòng quét mã QR hoặc chọn bàn phục vụ
org.oplearn.project.exception.TableInactiveException=Bàn hiện đang tạm ngưng phục vụ

# Order & Order Item Exceptions
org.oplearn.project.exception.OrderNotFoundException=Không tìm thấy đơn hàng
org.oplearn.project.exception.OrderItemNotFoundException=Không tìm thấy món trong đơn hàng
org.oplearn.project.exception.OrderItemsEmptyException=Danh sách món ăn không được để trống
org.oplearn.project.exception.InvalidOrderStatusException=Trạng thái chuyển đổi của đơn hàng không hợp lệ
org.oplearn.project.exception.InvalidOrderTypeException=Loại đơn hàng không hợp lệ (phục vụ tại bàn hoặc mang về)
org.oplearn.project.exception.OrderStatusNotPendingException=Chỉ có thể chỉnh sửa món khi đơn hàng đang ở trạng thái chờ tiếp nhận (PENDING)
org.oplearn.project.exception.PhoneNumberRequiredException=Vui lòng cung cấp số điện thoại người nhận hàng
org.oplearn.project.exception.DeliveryAddressRequiredException=Vui lòng cung cấp địa chỉ nhận hàng

# File & Storage & QR Exceptions
org.oplearn.project.exception.FileEmptyException=Tệp tin tải lên không được để trống
org.oplearn.project.exception.FileUploadException=Không thể tải lên tệp tin, vui lòng thử lại sau
org.oplearn.project.exception.QrCodeGenerationException=Lỗi trong quá trình tạo hình ảnh mã QR bàn

